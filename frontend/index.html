<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Dealers</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="topBar">
        <div class="left-buttons">
            <button class="action-btn race-btn" id="raceBtn">🏁 Race</button>
        </div>
        <div id="totalValueDisplay">€0</div>
        <div class="right-buttons">
            <input type="file" id="bgInput" style="display:none;" accept="image/*" />
            <button class="action-btn bg-btn" id="bgRemoveBtn">🗑️</button>
            <button class="action-btn bg-btn" id="bgUploadBtn">
                🖼️ Upload eigen garage
            </button>
            <button class="action-btn add-btn" id="uploadBtn">➕ Auto Toevoegen</button>
        </div>
    </div>
    <div id="loading" class="loading-overlay hidden">
        <div class="loading-box">
            <div class="spinner">
                <span>⚙️</span>
                <span>✨</span>
                <span>🚗</span>
            </div>

            <div class="progress-bar">
                <div class="progress"></div>
            </div>

            <div id="loadingText" class="loading-text">
                Processing...
            </div>
        </div>
    </div>

    <div id="garage"></div>

    <div id="collection"></div>

    <div id="raceModal" class="modal hidden">
        <div class="modal-content">
            <div id="winnerOverlay" class="winner-overlay hidden">
                <div class="winner-card">
                    <h1 id="winnerTitle"></h1>

                    <img id="winnerImage" />

                    <div id="winnerStats" class="winner-stats"></div>
                </div>
            </div>


            <div id="raceTrack">
                <div class="lane">
                    <img id="car1" />
                    <div class="flag" id="flag1">🏁</div>
                </div>
                <div class="lane">
                    <img id="car2" />
                    <div class="flag" id="flag2">🏁</div>
                </div>
            </div>
        </div>
    </div>

    <input type="file" id="fileInput" style="display:none;" accept="image/*" multiple />
    <input type="file" id="bgInput" style="display:none;" accept="image/*" />

    <div id="sidePanel" class="side-panel">
        <h2>Garage Stats</h2>
        <div id="metricSelectors" style="display: flex; flex-direction: column; gap: 5px;">
            </div>
        <div id="chartContainer" style="margin-top: 20px;">
            </div>
    </div>

    <button id="sidePanelButton" class="sidePanelButton">◀</button>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="app.js"></script>
</body>

</html>
