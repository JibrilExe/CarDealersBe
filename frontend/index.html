<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Dealers</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="topBar">
        <div class="left-buttons">
            <button class="action-btn race-btn" id="raceBtn">🏁 Race</button>
        </div>
        <div id="totalValueDisplay">€0</div>
        <div class="right-buttons">
            <select id="bgSelect" class="action-btn bg-btn">
                <button value="">🖼️ Kies Achtergrond</button>
            </select>
            <button class="action-btn add-btn" id="uploadBtn">➕ Auto Toevoegen</button>
        </div>
    </div>
    <div id="loading" style="display:none;">Processing...</div>

    <div id="garage"></div>

    <div id="collection"></div>

    <div id="raceModal" class="modal hidden">
        <div class="modal-content">
            <button id="closeRace">✖</button>
            <div id="raceResult"></div>

            <div id="raceTrack">
                <div class="lane">
                    <img id="car1" />
                    <div class="flag" id="flag1">🏁</div>
                </div>
                <div class="lane">
                    <img id="car2" />
                    <div class="flag" id="flag2">🏁</div>
                </div>
            </div>
        </div>
    </div>

    <input type="file" id="fileInput" style="display:none;" accept="image/*" multiple />
    <input type="file" id="bgInput" style="display:none;" accept="image/*" />

    <script type="module" src="app.js"></script>
</body>

</html>
