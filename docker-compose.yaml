services:
  db:
    image: postgres:15
    container_name: cars_db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cars
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: flask_backend
    restart: always
    ports:
      - "5001:5001"
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/cars
      REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN}
      GEMINI_API_PAID_TOKEN: ${GEMINI_API_PAID_TOKEN}
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - ./static:/app/static

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
