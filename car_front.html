<input type="file" id="fileInput" />

<button onclick="upload()">Upload</button>
<button onclick="loadCars()">Load Cars</button>
<button onclick="removeBg()">Remove BG</button>

<div id="gallery"></div>

<div id="loading" style="display:none;">Processing...</div>

<style>
.car {
    width: 200px;
    margin: 10px;
    cursor: pointer;
    border: 3px solid transparent;
    border-radius: 8px;
}

.car.selected {
    border: 3px solid #00aaff;
    box-shadow: 0 0 10px rgba(0,170,255,0.5);
}
</style>

<script>
let session_id = localStorage.getItem("session_id");
let selectedCar = null;
let loading = false;

if (!session_id) {
    session_id = crypto.randomUUID();
    localStorage.setItem("session_id", session_id);
}

function setLoading(state) {
    loading = state;
    document.getElementById("loading").style.display = state ? "block" : "none";
}

async function upload() {
    const file = document.getElementById("fileInput").files[0];
    if (!file || loading) return;

    setLoading(true);

    const formData = new FormData();
    formData.append("image", file);
    formData.append("session_id", session_id);

    await fetch("http://localhost:5000/upload", {
        method: "POST",
        body: formData
    });

    await loadCars();
    setLoading(false);
}

async function loadCars() {
    const res = await fetch(`http://localhost:5000/cars?session_id=${session_id}`);
    const cars = await res.json();

    const gallery = document.getElementById("gallery");
    gallery.innerHTML = "";

    cars.forEach(car => {
        const img = document.createElement("img");

        const url = car.bg_removed_url || car.image_url;

        img.src = "http://localhost:5000" + url;
        img.className = "car";

        // highlight selected
        if (selectedCar === car.id) {
            img.classList.add("selected");
        }

        img.onclick = () => {
            selectedCar = car.id;
            loadCars(); // refresh UI highlight
        };

        gallery.appendChild(img);
    });
}

async function removeBg() {
    if (!selectedCar || loading) {
        alert("Select a car first");
        return;
    }

    setLoading(true);

    await fetch("http://localhost:5000/remove-bg", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ car_id: selectedCar })
    });

    await loadCars();
    setLoading(false);
}
</script>
